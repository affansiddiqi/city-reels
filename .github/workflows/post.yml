name: Post Reel

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: city-reels-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # render.py draws text with Pillow, so the runner needs a bold face and a
      # colour-emoji face. Without these the reels render with missing glyphs.
      - name: Install fonts and render deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-dejavu-core fonts-liberation fonts-noto-color-emoji
          python3 -m pip install --quiet --upgrade pillow imageio-ffmpeg

      # Renders any script that has no video yet and schedules it, approved.
      - name: Top up the queue
        env:
          EVERY_HOURS: "8"
          MAX_NEW_PER_RUN: "8"
        run: python3 replenish.py

      # CRITICAL: this must happen BEFORE publishing. Instagram fetches the video
      # over a public raw.githubusercontent URL, so a freshly rendered file has to
      # be pushed first or the fetch 404s and the reel fails to process.
      - name: Publish new videos to the CDN
        run: |
          if [[ -n "$(git status --porcelain queue.json videos content)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A queue.json videos content
            git commit -m "chore: render and queue new reels [skip ci]"
            git pull --rebase -q origin main || true
            git push
          else
            echo "No new videos this run."
          fi

      - name: Publish anything that is due
        env:
          IG_PAGE_ACCESS_TOKEN: ${{ secrets.IG_PAGE_ACCESS_TOKEN }}
          IG_BUSINESS_ACCOUNT_ID: ${{ secrets.IG_BUSINESS_ACCOUNT_ID }}
          MAX_PER_RUN: "1"
        run: python3 post.py

      - name: Record what was posted
        if: always()
        run: |
          if [[ -n "$(git status --porcelain queue.json videos)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A queue.json videos
            git commit -m "chore: record posts, drop spent videos [skip ci]"
            git pull --rebase -q origin main || true
            git push
          else
            echo "Nothing posted this run."
          fi
